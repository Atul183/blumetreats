<svg id="bt-monogram-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" width="500" height="500">
                        <!-- Background Circle for structure -->
                        <circle cx="50" cy="50" r="45" stroke="#A3794F" stroke-width="3" fill="none"/>
                        
                        <!-- The 'B' shape (Clearly defined loops with strokes) -->
                        <line x1="30" y1="30" x2="30" y2="70" stroke="#6C5541" stroke-width="6" stroke-linecap="round"/>
                        <path d="M 30 30 C 50 30, 50 50, 30 50 M 30 50 C 55 50, 55 70, 30 70" stroke="#6C5541" stroke-width="6" fill="none" stroke-linecap="round"/>

                        <!-- The 'T' shape (clean and strong, intersects the B) -->
                        <path d="M 65 30 L 65 70 M 55 30 L 75 30" stroke="#A3794F" stroke-width="6" stroke-linecap="round"/>
                    </svg>